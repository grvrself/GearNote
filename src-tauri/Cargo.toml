[package]
name = "gearnote"
version = "0.1.0"
license = "Apache-2.0"
description = "GearNote desktop knowledge workspace"
authors = ["GearNote"]
edition = "2021"

[lib]
name = "knowflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
